<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>AI Study Assistant</h1>

        <div class="section">
            <h2>Upload File</h2>
            <input type="file" id="fileInput" accept=".pdf,.txt">
        </div>

        <div class="section">
            <h2>Or Paste Text</h2>
            <textarea id="textInput"
                placeholder="Paste notes or text here..."></textarea>
        </div>

        <button id="submitButton">Submit</button>

        <div class="section">
            <h2>Summary</h2>
            <div id="summaryBox" class="outputBox"></div>
        </div>

        <div class="section">
            <h2>Keywords</h2>
            <div id="keywordsBox" class="outputBox"></div>
        </div>

        <div class="section">
            <h2>Questions</h2>
            <div id="questionsBox" class="outputBox"></div>
        </div>

        <div class="section">
            <h2>Flashcards</h2>
            <div id="flashcardsBox" class="outputBox"></div>
        </div>

    <script src="script.js"></script>
</body>
</html>
